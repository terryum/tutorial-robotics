name = "tutorial-robotics-book"
main = "worker.mjs"
compatibility_date = "2026-11-23"

[assets]
directory = "../../site"
binding = "ASSETS"
run_worker_first = ["/api/book-feedback"]

[[ratelimits]]
name = "FEEDBACK_CLIENT_LIMITER"
namespace_id = "382001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "FEEDBACK_SITE_LIMITER"
namespace_id = "382002"
simple = { limit = 12, period = 60 }
