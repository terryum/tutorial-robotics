[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-hand2-motion-baselines"
version = "0.1.0"
description = "Gestures and PPO motion baselines for Wuji Hand 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Terry Um" }]
dependencies = [
    "gymnasium==1.3.0",
    "mujoco==3.11.0",
    "mujoco-ros2-core",
    "numpy==2.5.2",
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
    "torch==2.13.0",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
mujoco-ros2-core = { path = "deps/mujoco-ros2-core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
