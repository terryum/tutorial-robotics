[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-lab"
version = "1.0.0.dev0"
description = "Public, robot-oriented physical AI tutorials and experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Terry Um" }]
dependencies = [
    "gymnasium>=1.2,<2",
    "matplotlib>=3.10,<4",
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
ros = [
    "mujoco-ros2-core @ git+https://github.com/terryum/mujoco-ros2-core.git@b525d62f6bace3444fe22ce1dcfe65985b124a70",
]
hardware = []
docs = [
    "mkdocs>=1.6,<2",
    "pymdown-extensions>=10,<12",
]
learning = [
    "stable-baselines3>=2.7,<3",
    "tensorboard>=2.20,<3",
    "torch>=2.8,<3",
]

[project.scripts]
pal = "pai_lab.cli:main"
wuji-hand2-inspect = "wuji_hand2_setup.inspect:main"

[project.entry-points."pai_lab.robot_plugins"]
wuji = "pai_lab.robots.wuji_hand2:plugin"
enlight = "pai_lab.robots.enlight:plugin"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["examples/", "tests/"]

[[tool.mypy.overrides]]
# These runtime bindings ship no usable stubs in the portable Core environment.
module = ["mujoco.*", "scipy.*", "torch.*", "rclpy.*", "sensor_msgs.*", "std_srvs.*", "geometry_msgs.*", "tf2_ros.*", "rosbag2_py.*", "example_interfaces.*", "isaacsim.*", "omni.*", "mjlab.*", "wuji_mjlab.*", "lerobot.*", "pxr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pai_lab.installation_smoke",
    "wuji_hand2_motion.*",
    "wuji_hand2_setup.*",
]
ignore_errors = true
